id = "local.space-dir"
name = "Space Dir"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "スペース名を「1つ上のディレクトリ/今のディレクトリ」で出す"
platforms = ["macos", "linux"]

[[startup]]
command = ["zsh", "space-dir.zsh"]

[[events]]
on = "workspace.created"
command = ["zsh", "space-dir.zsh"]

[[events]]
on = "workspace.renamed"
command = ["zsh", "space-dir.zsh"]

[[events]]
on = "workspace.updated"
command = ["zsh", "space-dir.zsh"]

[[events]]
on = "tab.closed"
command = ["zsh", "space-dir.zsh"]
